[project]
name = "eolchecker"
version = "0.1.0"
description = "Check whether the major frameworks in a repo are past end-of-life"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "rich>=13",
    "pyyaml>=6",
]

[project.scripts]
eolchecker = "eolchecker.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eolchecker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: hits the real endoflife.date API (set EOLCHECKER_NETWORK=1)"]
